name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

env:
  BUILD_TYPE: Release
  PROJECT_NAME: WiseExec
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  code-quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install code quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            cppcheck \
            valgrind

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c++17 \
            --platform=unix64 \
            -I include \
            src/ || echo "cppcheck completed with warnings"

      - name: Upload code quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            cppcheck-results.xml
          retention-days: 7

  build-windows-mingw:
    name: Build Windows (MinGW)
    runs-on: windows-latest
    needs: [ code-quality-checks ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW
        run: |
          choco install mingw --version 13.2.0 --params="/InstallDir:C:\mingw64 /Architecture:x86_64" -y
          $env:Path = "C:\mingw64\bin;" + $env:Path
          [Environment]::SetEnvironmentVariable("Path", $env:Path, [EnvironmentVariableTarget]::Process)
          gcc --version

      - name: Install build tools
        run: |
          choco install ninja -y
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Resolve wxWidgets version
        shell: pwsh
        run: |
          # 用远程 tag 的 commit hash 作为 cache key：wx 更新后 key 自动变化，
          # 旧缓存失效 → 重新构建并保存新缓存（无需先 clone 即可取 hash）。
          $hash = (git ls-remote https://github.com/wxWidgets/wxWidgets.git "refs/tags/v3.3.0").Split("`t")[0]
          "wx_commit=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Cache wxWidgets (source + build)
        id: cache-wx
        uses: actions/cache@v4
        with:
          # 缓存整个 wxWidgets 源码树 + 构建产物，保证恢复后源码与产物时间戳
          # 相对一致，CMake 判定已是最新而不全量重编译。
          path: C:\wxWidgets
          key: wxwidgets-${{ env.wx_commit }}-mingw-${{ runner.os }}-${{ runner.arch }}

      - name: Clone wxWidgets source
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\wxWidgets\include\wx\wx.h')) {
            git clone --depth 1 --branch v3.3.0 --recurse-submodules https://github.com/wxWidgets/wxWidgets.git C:\wxWidgets
          } else {
            Write-Host "wxWidgets source already present (from cache), skipping clone"
          }

      - name: Build wxWidgets (MinGW static)
        shell: pwsh
        run: |
          cd C:\wxWidgets
          cmake -B build_mingw -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release `
            -DwxBUILD_SHARED=OFF -DwxBUILD_SAMPLES=OFF -DwxBUILD_DEMOS=OFF -DwxBUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build_mingw -- -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # CMake 构建的 wxWidgets 使用 GNU 'lib' 前缀命名（libwxmsw33u_core.a），
          # 而本项目 CMakeLists.txt 用不带前缀的精确文件名（:wxmsw33u_core.a）。
          # 另外 webp 相关库（webp/webpdemux/sharpyuv）作为 ExternalProject 构建
          # 在 libs\webp-build 下，不在 lib\gcc_x64_lib。统一把需要的库复制为
          # 不带前缀名并汇总到 gcc_x64_lib。
          # 使用绝对路径：Get-ChildItem 返回的 FullName 是绝对路径，若 $libDir
          # 用相对路径，Join-Path 生成的 $target 与之不同，无法拦截"复制到自身"。
          $libDir = 'C:\wxWidgets\build_mingw\lib\gcc_x64_lib'
          # 1) gcc_x64_lib 下 lib 前缀库 → 无前缀
          Get-ChildItem $libDir -Filter 'libwx*.a' | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $libDir ($_.Name -replace '^lib','')) -Force
          }
          # 2) 递归收集 webp 等 ExternalProject 构建的库。
          #    跳过与目标相同的文件：cache 命中后 gcc_x64_lib 里可能已存在
          #    无前缀副本，直接复制会报 "Cannot overwrite ... with itself"。
          Get-ChildItem build_mingw -Recurse -Filter '*.a' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(lib)?wx(webp|webpdemux|sharpyuv)\.a$' } |
            ForEach-Object {
              $target = Join-Path $libDir ($_.Name -replace '^lib','')
              if ($_.FullName -ne $target) {
                Copy-Item $_.FullName $target -Force
              }
            }
          Get-ChildItem $libDir -Filter "wx*.a" | Select-Object Name

      - name: Resolve yaml-cpp version
        shell: pwsh
        run: |
          $hash = (git ls-remote https://github.com/jbeder/yaml-cpp.git "refs/tags/0.8.0").Split("`t")[0]
          "yaml_commit=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Cache yaml-cpp (source + build)
        id: cache-yaml
        uses: actions/cache@v4
        with:
          path: |
            C:\yaml-cpp
            C:\yaml-cpp-install
          key: yaml-cpp-${{ env.yaml_commit }}-mingw-${{ runner.os }}-${{ runner.arch }}

      - name: Clone yaml-cpp source
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\yaml-cpp\CMakeLists.txt')) {
            git clone --depth 1 --branch 0.8.0 https://github.com/jbeder/yaml-cpp.git C:\yaml-cpp
          } else {
            Write-Host "yaml-cpp source already present (from cache), skipping clone"
          }

      - name: Build yaml-cpp (static)
        shell: pwsh
        run: |
          cd C:\yaml-cpp
          # yaml-cpp 0.8.0 declares cmake_minimum_required(3.4); CMake 4.x dropped
          # support for CMake < 3.5, so bump the requirement before configuring.
          (Get-Content CMakeLists.txt -Raw) -replace 'cmake_minimum_required\(VERSION 3\.4\)','cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt
          # yaml-cpp 0.8.0's emitterutils.cpp uses uint16_t/uint32_t without
          # including <cstdint>; newer GCC (>=13) no longer pulls it in transitively.
          $p = 'C:\yaml-cpp\src\emitterutils.cpp'
          (Get-Content $p -Raw) -replace '#include <algorithm>', "#include <algorithm>`n#include <cstdint>" | Set-Content $p
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release `
            -DYAML_BUILD_SHARED_LIBS=OFF -DYAML_CPP_BUILD_TESTS=OFF -DYAML_CPP_BUILD_TOOLS=OFF `
            -DCMAKE_INSTALL_PREFIX=C:\yaml-cpp-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build -- -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build

      - name: Configure CMake for MinGW
        run: |
          cmake -B build/mingw -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release `
            -DWX_ROOT=C:/wxWidgets `
            -Dyaml-cpp_DIR=C:/yaml-cpp-install/lib/cmake/yaml-cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with MinGW
        run: |
          cmake --build build/mingw --config Release

      - name: Create package with CPack
        run: |
          cd build/mingw
          cpack -G ZIP -C Release

          Write-Host "Generated packages:"
          Get-ChildItem "*.zip" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }

      - name: Upload MinGW artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw-packages
          path: |
            build/mingw/*.zip
            build/mingw/bin/*.exe
          retention-days: 7

  build-linux-gcc:
    name: Build Linux (GCC)
    runs-on: ubuntu-latest
    needs: [ code-quality-checks ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libwxgtk3.2-dev \
            wx-common \
            libyaml-cpp-dev

      - name: Configure CMake
        run: |
          cmake -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cmake --build build/linux

      - name: Create package
        run: |
          cd build/linux
          mkdir -p package/bin
          cp bin/WiseExec package/bin/
          tar czf WiseExec-${{ env.BUILD_TYPE }}-Linux.tar.gz -C package .

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/linux/*.tar.gz
            build/linux/bin/*
          retention-days: 7

  build-linux-arm64:
    name: Build Linux ARM64 (GCC)
    runs-on: ubuntu-24.04-arm
    needs: [ code-quality-checks ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libwxgtk3.2-dev \
            wx-common \
            libyaml-cpp-dev

      - name: Configure CMake
        run: |
          cmake -B build/linux-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cmake --build build/linux-arm64

      - name: Create package
        run: |
          cd build/linux-arm64
          mkdir -p package/bin
          cp bin/WiseExec package/bin/
          tar czf WiseExec-${{ env.BUILD_TYPE }}-Linux-ARM64.tar.gz -C package .

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-packages
          path: |
            build/linux-arm64/*.tar.gz
            build/linux-arm64/bin/*
          retention-days: 7

  build-macos-clang:
    name: Build macOS (Clang)
    runs-on: macos-latest
    needs: [ code-quality-checks ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja wxwidgets yaml-cpp

      - name: Configure CMake
        run: |
          cmake -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local

      - name: Build
        run: |
          cmake --build build/macos

      - name: Create package with CPack
        run: |
          cd build/macos
          cpack -G ZIP -C Release

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            build/macos/*.zip
            build/macos/bin/*
          retention-days: 7

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      [
        build-windows-mingw,
        build-linux-gcc,
        build-linux-arm64,
        build-macos-clang,
      ]
    # 只在推送tag时创建发布
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows-mingw.result == 'success' &&
      needs.build-linux-gcc.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      needs.build-macos-clang.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      [
        code-quality-checks,
        build-windows-mingw,
        build-linux-gcc,
        build-linux-arm64,
        build-macos-clang,
        create-release,
      ]
    if: always()

    steps:
      - name: Display build status
        run: |
          echo "=== Build Status Summary ==="
          echo "Code Quality Checks: ${{ needs.code-quality-checks.result }}"
          echo "Windows MinGW: ${{ needs.build-windows-mingw.result }}"
          echo "Linux GCC: ${{ needs.build-linux-gcc.result }}"
          echo "Linux ARM64: ${{ needs.build-linux-arm64.result }}"
          echo "macOS Clang: ${{ needs.build-macos-clang.result }}"
          echo "Create Release: ${{ needs.create-release.result }}"
          echo "============================"

          # 检查是否有失败的构建
          FAILED_JOBS=""
          if [[ "${{ needs.code-quality-checks.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Code Quality Checks"; fi
          if [[ "${{ needs.build-windows-mingw.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Windows MinGW"; fi
          if [[ "${{ needs.build-linux-gcc.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Linux GCC"; fi
          if [[ "${{ needs.build-linux-arm64.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Linux ARM64"; fi
          if [[ "${{ needs.build-macos-clang.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS macOS Clang"; fi
          if [[ "${{ needs.create-release.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Create Release"; fi

          if [[ -n "$FAILED_JOBS" ]]; then
            echo "Failed jobs:$FAILED_JOBS"
            echo "Some builds failed. Check the logs for details."
            exit 1
          else
            echo "All builds completed successfully!"
          fi
